name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # 85%: a few points of headroom below the ~90% this suite actually
      # hits as of this threshold's introduction - enough to catch a
      # real regression without being so tight it flakes on incidental
      # coverage shifts (e.g. a print-formatting branch or a real-
      # hardware-only code path nobody's expected to unit test).
      - run: pytest -v --cov=b6charger --cov-report=term-missing --cov-fail-under=85

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy b6charger

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: bandit -r b6charger/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # self_update.sh runs as root and redeploys the host - it gets the
      # same static-analysis bar as the Python. Pinned to the version in
      # .pre-commit-config.yaml rather than the runner image's apt
      # package: the two disagree on which checks are on by default
      # (SC2002 broke CI for a month while passing locally).
      - run: pip install shellcheck-py==0.11.0.1
      - run: shellcheck -s sh systemd/charger-pi/self_update.sh
