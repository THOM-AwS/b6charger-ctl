[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b6charger-ctl"
version = "0.8.1"
description = "Read/write control for SkyRC B6-family balance chargers (iMAX B6 / B6AC / B6 mini and rebadged clones)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.scripts]
b6ctl = "b6charger.cli:main"

[project.optional-dependencies]
# Pinned to match .pre-commit-config.yaml exactly (not just a loose
# floor like the old ">=0.6"/">=24") - CI's `pip install -e ".[dev]"`
# otherwise resolves whatever's newest at the time it happens to run,
# which can silently diverge from what pre-commit enforces locally:
# "passes pre-commit, fails CI lint" (or vice versa) with no config
# change on either side. Bump both together when upgrading.
dev = [
    "pytest>=7",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "black==26.5.1",
    "bandit==1.9.4",
    "mypy==2.3.0",
]

[tool.setuptools]
packages = ["b6charger"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 95
target-version = ["py311"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = [
    "D203",  # conflicts with D211 (no-blank-line-before-class)
    "D213",  # conflicts with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # tests document themselves via their names

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.11"
# Deliberately not --strict: this codebase types every public function
# signature (a real, checked guarantee worth enforcing in CI - hence
# disallow_untyped_defs below) but doesn't chase every strict-mode nit
# (e.g. requiring dict[K, V] everywhere a bare dict appears, even for
# genuinely heterogeneous JSON-shaped bodies) where the extra
# precision wouldn't catch a real bug. Tighten this over time as
# specific gaps turn out to matter.
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
